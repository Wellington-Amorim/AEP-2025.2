name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: doacoes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Initialize Database (MySQL-specific schema)
      run: mysql -h 127.0.0.1 -u root -proot doacoes < src/main/resources/schema-mysql.sql
    
    - name: Build and Test with Maven
      run: mvn -B verify --file pom.xml
    
    - name: Upload Test Results
      if: always() && hashFiles('target/surefire-reports/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
    
    - name: Upload Coverage Report
      if: always() && hashFiles('target/site/jacoco/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/site/jacoco/